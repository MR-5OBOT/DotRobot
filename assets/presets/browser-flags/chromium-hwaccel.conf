# Hardware video decode and encode through VA-API, for Chromium-based browsers.
# Linked as ~/.config/<browser>-flags.conf by scripts/setup-browser-flags.sh.
# Keep one flag per line: some launchers (brave-bin) pass each line as one argument.
# Chromium 143+ and Brave 1.85+ already decode on the GPU under Wayland; this keeps it
# on for other builds and adds encode. Check with chrome://media-internals (video_decoder)
# while a video plays. Flags: https://chromium.googlesource.com/chromium/src/+/main/docs/gpu/vaapi.md
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
