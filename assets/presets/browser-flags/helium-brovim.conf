# Helium-only: same GPU/accessibility flags as chromium-hwaccel.conf, plus the
# override needed by Brovim's browser-page support, loaded from its repository root.
# This permits extensions with explicit chrome:// permissions to access browser pages.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
--force-renderer-accessibility=basic
--extensions-on-chrome-urls
