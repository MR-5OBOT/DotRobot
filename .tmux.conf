##### General Settings #####

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Set default shell
set-option -g default-shell $SHELL

# Fast response
set -s escape-time 0

# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

# Enable true color support for modern terminals
set-option -sa terminal-features ',tmux-256color:RGB'
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -sa terminal-features ',xterm-kitty:RGB'
set-option -sa terminal-features ',alacritty:RGB'
set-option -sa terminal-features ',wezterm:RGB'

# Terminal overrides for compatibility
set-option -ga terminal-overrides ',xterm*:Tc'
set-option -ga terminal-overrides ',tmux-256color:Tc'
set-option -ga terminal-overrides ',screen-256color:Tc'
set-option -ga terminal-overrides ',xterm-kitty:Tc'
set-option -ga terminal-overrides ',alacritty:Tc'
set-option -ga terminal-overrides ',wezterm:Tc'

##### Mouse #####

set -g mouse on

##### Prefix Key #####

# Unbind default prefix
unbind C-b

# Set new prefix to Ctrl-Space
set -g prefix C-Space
bind C-Space send-prefix

##### Keybindings #####

# Quick detach & kill-server
bind d detach-client
bind-key q kill-server

# Create a new session
bind n command-prompt -p "New session name:" "new-session -s '%%'"

# Toggle status bar
bind-key b set-option status

# Window navigation
bind H previous-window
bind L next-window

# Pane navigation (vim-tmux-navigator compatible)
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# Pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Splitting windows in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open lazygit in a new window
bind G new-window -n 'lazygit' -c "#{pane_current_path}" lazygit

##### Window and Pane Settings #####

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Status Bar #####

# Status bar settings
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g status-style bg=default,fg=brightblack

# Status bar content
# set -g status-right '#[fg=brightblack]#[default]#(whoami)'

##### Appearance #####

# Pane borders
set -g pane-active-border-style 'fg=#BE4277'
set -g pane-border-style 'fg=#161616'

# Copy mode and vi keys
setw -g mode-keys vi
setw -g mode-style 'fg=#DD4D8B bg=#000000 bold'

# Clipboard integration
set -g set-clipboard on

##### Notifications #####

# Disable activity monitoring (no highlights or bells)
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off

##### Plugins #####

# Plugin manager and plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep this last)
run '~/.tmux/plugins/tpm/tpm'
