
include black.ini

allow_remote_control no

kitten=image-pipe

font_family      IosevkaTermNerdFont
# font_family      IosevkaTermNerdFontMono

bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.5

text_composition_strategy legacy
modify_font cell_width 95%

enable_audio_bell no

remember_window_size yes
dynamic_background_opacity yes
hide_window_decorations yes
# window_padding_width 0
# window_padding_height 0
window_margin_width 5
placement_strategy top

cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.01 0.15
cursor_shape block
cursor_blink true

# Tabs -- mirrors the tmux status bar: top edge, centred, 1-indexed, accent on
# the active tab. tab_bar.py adds the right-hand clock, which the built-in
# styles cannot do.
tab_bar_edge top
tab_bar_style custom
tab_bar_align center
tab_bar_min_tabs 1
tab_title_template "{index}:{title}"
tab_bar_margin_height 0.0 0.0
tab_activity_symbol none
tab_separator " "

# Flat and monochrome, like tmux's window-status-style "none": no background
# fills, dim inactive, bold light active. The accent is reserved for focus,
# not for painting a block behind every tab.
active_tab_background   #000000
active_tab_foreground   #ffffff
active_tab_font_style   bold
inactive_tab_background #000000
inactive_tab_foreground #585858
inactive_tab_font_style normal
tab_bar_background      #000000

# splits layout is what makes | and - work; stack is the zoom equivalent
enabled_layouts splits,stack

# Same prefix and same keys as tmux.conf, using kitty's chord support, so the
# muscle memory carries over. tmux still owns C-Space when it is running --
# these only apply to a bare kitty.
map ctrl+space>c new_tab_with_cwd
map ctrl+space>w close_tab
map ctrl+space>tab next_tab
map ctrl+space>r load_config_file
map ctrl+space>shift+r set_tab_title

map ctrl+space>| launch --location=vsplit --cwd=current
map ctrl+space>- launch --location=hsplit --cwd=current
map ctrl+space>h neighboring_window left
map ctrl+space>j neighboring_window down
map ctrl+space>k neighboring_window up
map ctrl+space>l neighboring_window right
map ctrl+space>x close_window
map ctrl+space>z toggle_layout stack
map ctrl+space>space next_layout

map ctrl+space>shift+g launch --type=tab --cwd=current lazygit
