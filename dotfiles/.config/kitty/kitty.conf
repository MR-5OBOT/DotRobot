
include black.ini

# Remote control only over this socket, in the private (0700) runtime dir: smart-splits.nvim
# and kitty-scrollback.nvim use it. Not an @abstract socket, which any local user could reach.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

font_family      IosevkaTermNerdFont
# font_family      IosevkaTermNerdFontMono

bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.5

text_composition_strategy legacy
modify_font cell_width 95%

enable_audio_bell no

remember_window_size no
dynamic_background_opacity yes
background_opacity 0.95
hide_window_decorations yes
# window_padding_width 0
# window_padding_height 0
# Panes split like tmux: one 2px line between them (1px edge from each pane, the active
# one purple), a little air each side.
# A margin would box every pane (it turns off draw_minimal_borders), so only a lone
# window gets one.
window_margin_width 0
single_window_margin_width 5
window_padding_width 3
single_window_padding_width 0
window_border_width 1px
placement_strategy top

cursor_trail 10
cursor_trail_start_threshold 0
# no-rc: zsh loads it itself (zsh/.zshrc). no-title: zsh sets tab names (functions.zsh).
shell_integration no-rc no-cursor no-title
confirm_os_window_close 1
cursor_trail_decay 0.01 0.15
cursor_shape block
cursor_blink_interval 0.5

# None of kitty's default shortcuts: Super is Hyprland's. Ours: paste + scroll, then the
# tmux-style workflow (Alt+Space prefix, Alt+H/J/K/L...) that replaces tmux.
clear_all_shortcuts yes
include scroll-paste.conf
include workflow.conf
