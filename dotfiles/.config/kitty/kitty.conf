
include black.ini

allow_remote_control no

kitten=image-pipe

font_family      IosevkaTermNerdFont
# font_family      IosevkaTermNerdFontMono

bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.5

text_composition_strategy legacy
modify_font cell_width 95%

enable_audio_bell no

remember_window_size yes
dynamic_background_opacity yes
hide_window_decorations yes
# window_padding_width 0
# window_padding_height 0
window_margin_width 5
placement_strategy top

cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
# Never ask "are you sure you want to close". The default -1 is meant to skip
# the prompt at an idle shell prompt, but that relies on shell integration
# reporting prompt state, which it is not doing here -- so kitty counts plain
# zsh as a running command and asks every time.
confirm_os_window_close 0
cursor_trail_decay 0.01 0.15
cursor_shape block
cursor_blink true
