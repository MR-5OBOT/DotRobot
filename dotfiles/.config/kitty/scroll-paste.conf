# Loaded by kitty.conf and by quick-access-plain.conf (Super+Z terminal).
# - Paste.
# - Scroll with Caps+U / Caps+D (20 lines, about half of quick-access) and Caps+G /
#   Caps+Shift+G (top / bottom); keyd sends PageUp / PageDown / Ctrl+Home / Ctrl+End.
#   They scroll a plain shell's history, e.g. in quick-access. Full-screen apps (tmux,
#   nvim, claude) still get the keys and scroll themselves.
#   shortcut: kitty has no half-page action, so it is a fixed 20; change the count if windows get much taller.
map ctrl+shift+v paste_from_clipboard
map page_up combine : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up
map page_down combine : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down
map ctrl+home scroll_home
map ctrl+end scroll_end
