# tmux-style workflow in plain kitty (replaces tmux). Prefix = Alt+Space, as in tmux.
# tmux "windows" are kitty tabs, tmux panes are kitty windows in the splits layout.
# The Super+Z quick-access terminal drops all of this (quick-access-plain.conf).

enabled_layouts splits,stack

# The prefix is a keyboard mode, not "alt+space>key" sequences: kitty types a key that no
# sequence matches into the program (Prefix+N in nvim = search next); here it's ignored,
# like tmux. One action, then the mode ends.
map --new-mode prefix --on-unknown end --on-action end alt+space

# --- Panes ---------------------------------------------------------------------------

map --mode prefix |     launch --location=vsplit --cwd=current
map --mode prefix minus launch --location=hsplit --cwd=current

# Move (no prefix). Inside nvim the key goes to nvim instead (smart-splits.nvim sets the
# IS_NVIM user var): it walks nvim's splits first, then hops to the next kitty pane.
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+l

# Close the pane (no prefix) whatever runs in it, nvim included; always asks y/n first.
map alt+x close_window_with_confirmation

# Resize (no prefix), also from inside nvim like tmux did: the border moves the way the key points.
map alt+ctrl+h kitten resize_dir.py left
map alt+ctrl+j kitten resize_dir.py down
map alt+ctrl+k kitten resize_dir.py up
map alt+ctrl+l kitten resize_dir.py right

# Zoom: Z, Alt+Z or Ctrl+Z after the prefix
map --mode prefix z      toggle_layout stack
map --mode prefix alt+z  toggle_layout stack
map --mode prefix ctrl+z toggle_layout stack

# Prefix twice: the program gets Alt+Space
map --mode prefix alt+space send_key alt+space

map --mode prefix r     load_config_file
map --mode prefix alt+r load_config_file
# Prefix+?: searchable list of every map and action
map --mode prefix ? command_palette

# --- Copy mode -----------------------------------------------------------------------

# Prefix+[: screen + scrollback in nvim (kitty-scrollback.nvim), vi keys, y copies and closes.
# nvim runs its own small config (scrollback.lua), no history/plugins/swap: opens ~25 ms sooner.
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --nvim-args -u ~/.config/kitty/scrollback.lua -i NONE --noplugin -n
map --mode prefix [ kitty_scrollback_nvim
# Prefix+Y: the last command's output straight to the clipboard, no copy mode (needs the
# shell integration's prompt marks, zsh/.zshrc).
map --mode prefix y launch --stdin-source=@last_cmd_output --type=clipboard
# Copy mode loads all of it, so keep it short: ~0.5 s to open at 20k lines.
scrollback_lines 1000

# --- Tabs (tmux windows) -------------------------------------------------------------

map --mode prefix c       new_tab
map --mode prefix space   goto_tab -1
map --mode prefix shift+r set_tab_title
map --mode prefix g       launch --type=tab --cwd=current --tab-title=lazygit lazygit
map --mode prefix 1 goto_tab 1
map --mode prefix 2 goto_tab 2
map --mode prefix 3 goto_tab 3
map --mode prefix 4 goto_tab 4
map --mode prefix 5 goto_tab 5
map --mode prefix 6 goto_tab 6
map --mode prefix 7 goto_tab 7
map --mode prefix 8 goto_tab 8
map --mode prefix 9 goto_tab 9
map --mode prefix 0 goto_tab 10

# --- Look (was tmux's status bar + pane borders) -------------------------------------

tab_bar_edge top
tab_bar_align center
tab_bar_min_tabs 1
tab_bar_style separator
tab_separator "   "
# Name set with Prefix+Shift+R, else the window title: zsh sets it to the running program
# (zsh, nvim...) like tmux's automatic-rename (zsh/conf.d/functions.zsh). "1:zsh" like tmux,
# {index} renumbers on close; "1:zsh·Z" while a pane is zoomed (Prefix+Z = stack layout).
# Tab names turn purple while the prefix waits for its key (tmux's PREFIX); a colour, not a
# label, so the centred tabs don't jump.
tab_title_template "{fmt.fg._5B2A69 if keyboard_mode == 'prefix' else ''}{index}:{title}{'·Z' if layout_name == 'stack' and num_window_groups > 1 else ''}"
tab_bar_background      #000000
active_tab_background   #000000
inactive_tab_background #000000
active_tab_foreground   #505050
active_tab_font_style   bold
inactive_tab_foreground #333333
inactive_tab_font_style normal
active_border_color   #5B2A69
inactive_border_color #161616
