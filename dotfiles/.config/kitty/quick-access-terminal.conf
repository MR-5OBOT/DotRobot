# Shared float terminal (Super+Z): 68% x 80%, centered.
# shortcut: margins are fixed px sized for the 1920x1080 HDMI screen; on eDP-1 (1280x720 logical) it comes out ~52% x 70%.
edge center
margin_left 307
margin_right 307
margin_top 108
margin_bottom 108
hide_on_focus_loss no
# Don't inherit confirm_os_window_close 1 from kitty.conf: a modal "Close OS
# window?" prompt inside a hidden panel is unanswerable and wedges toggling.
kitty_override confirm_os_window_close=0
