general {
    ignore_empty_input = true
}

auth {
    # hyprlock talks to fprintd over D-Bus directly - no PAM edit needed here.
    fingerprint {
        enabled = true
        ready_message = (or scan 󰈷)
        present_message = (scanning 󰈷)
        retry_delay = 250 # ms between failed scan and re-arming the sensor
    }
}

background {
    monitor =
    path = $HOME/Pictures/wallpapers/money.jpg   
}

input-field {
    monitor =
    size = 340, 55
    outline_thickness = 3
    font_family = IosevkaTerm Nerd Font
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(FFFFFF)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false # keep the fingerprint hint visible
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password... $FPRINTPROMPT</i>
    hide_input = false
    rounding = 40 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = Fira Semibold
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 40
    font_family = Fira Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    # path = $HOME/Pictures/wallpapers/b.png
    size = 280 # lesser side if not 1:1 ratio
    rounding = 40 # negative values mean circle
    border_size = 4
    border_color = rgb(221, 221, 221)
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}

label {
    monitor =
    # shows nothing unless fprintd is installed AND a finger is enrolled
    text = cmd[update:0] command -v fprintd-list >/dev/null && fprintd-list "$(id -un)" 2>/dev/null | grep -q "^Fingerprints for" && echo "󰈷  Touch the sensor to unlock" || echo ""
    color = rgba(200, 200, 200, 0.85)
    font_size = 16
    font_family = IosevkaTerm Nerd Font
    position = 0, -90
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgb(0,0,0)
}
