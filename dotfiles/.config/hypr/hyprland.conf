# @MR5OBOT hyprland cfg

# █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

# See https://wiki.hyprland.org/Configuring/Keywords/
source = $HOME/.config/hypr/configs/autostart.conf
source = $HOME/.config/hypr/configs/ENVariales.conf
source = $HOME/.config/hypr/configs/Keymaps.conf
source = $HOME/.config/hypr/configs/Animations.conf
source = $HOME/.config/hypr/configs/Theme.conf
source = $HOME/.config/hypr/configs/WindowRules.conf
source = $HOME/.config/hypr/configs/inputs.conf
source = $HOME/.config/hypr/configs/swaync.conf
# source = $HOME/.config/hypr/configs/Monitors.conf

misc {
  vrr = 0
#  focus_on_activate = true
  # mouse_move_enables_dpms = true
  enable_swallow = true # swallowing terminal window after open apps from it.
  swallow_regex = ^(kitty)$
  disable_hyprland_logo = true
  # disable_splash_rendering = true
  force_default_wallpaper = 0
}
