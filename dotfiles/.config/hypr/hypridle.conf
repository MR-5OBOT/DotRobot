# No suspend. Lid close = lock (via logind HandleLidSwitch=lock).
# Idle: lock at 30min, screen off at 31min. That's it.

general {
    lock_cmd = qs ipc call lock lock       # quickshell lockscreen (Lock.qml)
}

listener {
    timeout = 1800                          # 30min
    on-timeout = loginctl lock-session      # lock (fires lock_cmd)
}

listener {
    timeout = 1860                                            # 31min
    on-timeout = hyprctl dispatch dpms off                   # screen off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on when activity resumes
}
