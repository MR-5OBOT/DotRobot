# Lid close = suspend (logind default); nothing hibernates automatically.
# Idle: lock at 20min, screen off at 25min, suspend at 30min. Suspend also locks.

general {
    lock_cmd = $HOME/.config/quickshell/island/scripts/lock.sh   # pauses media, then hyprlock (fingerprint)
    before_sleep_cmd = loginctl lock-session    # lock before suspend (incl. lid)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # wake display on resume
}

listener {
    timeout = 1200                          # 20min
    on-timeout = loginctl lock-session      # lock (fires lock_cmd)
}

listener {
    timeout = 1500                                            # 25min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'  # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && brightnessctl -r  # screen on when activity resumes
}

listener {
    timeout = 1800                          # 30min
    on-timeout = systemctl suspend
}
