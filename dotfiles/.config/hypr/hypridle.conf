# Lid close = suspend (logind default, no config needed).
# Idle: lock at 30min, screen off at 31min. Suspend also locks.

general {
    lock_cmd = qs ipc call lock lock            # quickshell lockscreen (Lock.qml)
    before_sleep_cmd = loginctl lock-session    # lock before suspend (incl. lid)
    after_sleep_cmd = hyprctl dispatch dpms on  # wake display on resume
}

listener {
    timeout = 1800                          # 30min
    on-timeout = loginctl lock-session      # lock (fires lock_cmd)
}

listener {
    timeout = 1860                                            # 31min
    on-timeout = hyprctl dispatch dpms off                   # screen off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on when activity resumes
}
