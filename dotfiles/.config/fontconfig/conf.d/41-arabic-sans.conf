<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer plain Noto Sans Arabic (not Naskh/Kufi) for Arabic. Weak append:
       only affects characters the requested font cannot draw, so
       Latin/CJK/Cyrillic are untouched. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Arabic UI</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans Arabic UI</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <!-- Generic "serif" (browser default) would otherwise pick Naskh for Arabic:
       Naskh carries genericfamily=serif, which outranks weak family bindings,
       so this one must be strong. Only fires for serif+Arabic requests. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic UI</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <!-- Hide the calligraphic Arabic-script styles entirely so nothing can
       fall back to them. Delete this block to get them back. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Naskh Arabic</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Naskh Arabic UI</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Kufi Arabic</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Nastaliq Urdu</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
