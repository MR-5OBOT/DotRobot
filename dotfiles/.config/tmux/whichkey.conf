# Which-key cheatsheet — read-only popup (no focus / no selection cursor)
# Open with: prefix (C-Space) + ?   |   press any key to close.
# Just displays the keybinding list from whichkey.txt; nothing is runnable.
# Border color matches pane-active-border-style (#BE4277).
bind-key ? display-popup -w 36 -h 30 -b single -S "fg=#BE4277" -E \
    "bash -c 'tput civis; cat ~/.config/tmux/whichkey.txt; read -rsn1; tput cnorm'"
