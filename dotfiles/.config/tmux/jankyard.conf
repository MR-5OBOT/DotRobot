# Jankyard scratch notes popup
# Toggle with: prefix (C-Space) + o
#
# Backed by a persistent detached session named "jankyard", so the popup
# remembers state (cursor, scroll, unsaved buffer) across hide/show.
#   - Outside the popup -> open it (attach/create "jankyard" + launch nvim).
#   - Inside the popup   -> detach-client = hide it (session stays alive).
#   - :q inside nvim     -> fully closes it; next open starts fresh.
bind-key o if-shell -F '#{==:#{session_name},jankyard}' {
    detach-client
} {
    display-popup -E -w 60% -h 80% \
        "tmux new-session -A -s jankyard 'nvim ~/repos/jankyard.md'"
}
