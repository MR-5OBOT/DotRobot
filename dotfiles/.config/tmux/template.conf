# Starting layout for the first plain `tmux` after login (wrapper: zsh/conf.d/functions.zsh).
# Shells only. Edit freely: -n names a window, -h splits side by side, -v splits top/bottom,
# -c sets the folder (default: wherever you typed tmux), -p sets a split's size in percent.

new-session -d -s main -n code
split-window -h

new-window -n git

new-window -n sys

select-window -t main:code
select-pane -t main:code.1
