##### General Settings #####
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind R command-prompt -I "#W" "rename-window '%%'"

# Alt still held after the Alt+Space prefix = same action as the plain key
bind M-r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind M-z resize-pane -Z
bind C-z resize-pane -Z # tmux's default here suspends the client; keeps the old prefix+Ctrl+Z zoom habit safe

# Session & window selector: borderless black popup sized to its list (nav_list.py opens it)
bind-key w run-shell -b 'python3 "$HOME/.config/tmux/nav_list.py" popup "#{client_name}"'

# Layout template: prefix+s saves this session's windows, prefix+t adds them to the current session
bind s confirm-before -p 'Overwrite tmux template? (y/n)' 'run-shell "python3 $HOME/.config/tmux/template.py #{pane_id}"'
bind t source-file ~/.config/tmux/template.conf
set -s escape-time 0

# Enable True color support
set -g default-terminal "tmux-256color"
set -g allow-passthrough on

set -g mouse on
set -g history-limit 50000
set -g status-keys emacs # else EDITOR=nvim makes prompts vi-mode
set -g focus-events on
setw -g aggressive-resize on

##### Prefix Key #####
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix
bind Space last-window # replaces default next-layout

##### Keybindings #####
bind-key b set-option status

# Window navigation (prefix+Space = last window, above)
unbind Tab
bind M-n next-window
bind M-p previous-window

# Disable tmux 3.8 native float bindings
unbind @
unbind BTab
unbind '*'
unbind -n C-MouseDrag1Pane
unbind -n C-MouseDrag1Empty

# Alt+hjkl: nvim gets the key (vim-tmux-navigator), else move pane.
# Alt+x: nvim closes its split, else close the pane (asks first).
%hidden NAV="#{m/ri:^(n?vim?|view)$,#{pane_current_command}}"
bind -n M-h if -F "$NAV" 'send M-h' 'select-pane -L'
bind -n M-j if -F "$NAV" 'send M-j' 'select-pane -D'
bind -n M-k if -F "$NAV" 'send M-k' 'select-pane -U'
bind -n M-l if -F "$NAV" 'send M-l' 'select-pane -R'
bind -n M-x if -F "$NAV" 'send M-x' 'confirm-before -p "kill-pane #P? (y/n)" kill-pane'
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# Alt+Ctrl+hjkl moves the pane border (hold to keep going). Steps: 5 columns sideways, 2 rows up/down.
bind -n C-M-h resize-pane -L 5
bind -n C-M-j resize-pane -D 2
bind -n C-M-k resize-pane -U 2
bind -n C-M-l resize-pane -R 5

# Splitting windows in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open lazygit in a new window
bind g new-window -n 'lazygit' -c "#{pane_current_path}" lazygit

# Start window numbering at 1
set -g base-index 1
bind 0 select-window -t :=10
setw -g pane-base-index 1
set -g renumber-windows on

##### Status Bar #####
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 5

setw -g window-status-style "none"
set -g window-status-current-style "fg=#505050,bold"
set -g status-style bg=default,fg=brightblack

# Prefix indicator: a Hyprland purple rail + chord lights up top-left while prefix is active
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[fg=#5B2A69#,bold]▌#[fg=#5B2A69#,bold] PREFIX #[default], }"

# Pane borders
set -g pane-active-border-style 'fg=#5B2A69'
set -g pane-border-style 'fg=#161616'

# Copy mode and vi keys
setw -g mode-keys vi
setw -g mode-style 'fg=#7B398E,bg=#000000,bold'
set -g copy-mode-selection-style 'fg=#000000,bg=#51265E'
bind -T copy-mode-vi v send -X begin-selection
# x = cut: copies; also deletes it if the selection is on the line being typed
bind -T copy-mode-vi x run-shell 'bash "$HOME/.config/tmux/cut.sh" #{pane_id} #{selection_present} #{selection_start_x} #{selection_start_y} #{selection_end_x} #{selection_end_y} #{cursor_x} #{cursor_y} #{history_size}'

# Clipboard: copies (y, Enter, mouse drag) go to the Wayland clipboard
set -g set-clipboard on
set -s copy-command 'wl-copy'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
