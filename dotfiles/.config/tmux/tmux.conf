##### General Settings #####
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind R command-prompt -I "#W" "rename-window '%%'"
set -s escape-time 0

# Enable True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# set -g detach-on-destroy off
set -g mouse on

##### Prefix Key #####
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

##### Keybindings #####
bind d detach-client

bind-key b set-option status

# Window navigation
bind-key Tab next-window

# Pane navigation (vim-tmux-navigator compatible)
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# Splitting windows in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Toggle layout: flip panes between side-by-side and stacked
bind Space if-shell -F '#{@vlayout}' \
  'select-layout even-horizontal ; set -w @vlayout 0' \
  'select-layout even-vertical ; set -w @vlayout 1'

# Open lazygit in a new window
bind G new-window -n 'lazygit' -c "#{pane_current_path}" lazygit

# Floating terminal — omerxx/tmux-floax (prefix + o toggle, prefix + x close)
# Backed by a persistent "jankyard" session, so the float keeps its state.
# In-float menu: prefix + P, plus C-M-s/b/f/r resize, C-M-e embed.
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'o'
set -g @floax-width '56%'
set -g @floax-height '80%'
set -g @floax-border-color '#893056'
set -g @floax-text-color 'default'
set -g @floax-session-name 'jankyard'
set -g @floax-change-path 'false'

# Close the float when inside it, otherwise default kill-pane
bind-key x if-shell -F '#{==:#{session_name},jankyard}' {
    kill-session -t jankyard
} {
    confirm-before -p "kill-pane #{pane_index}? (y/n)" kill-pane
}

# Which-key style popup menu (prefix + ?)
source-file ~/.config/tmux/whichkey.conf

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Status Bar #####
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 5

setw -g window-status-style "none"
set -g window-status-current-style "fg=#505050,bold"
set -g status-style bg=default,fg=brightblack

# Prefix indicator: a solid muted-pink rail + chord lights up top-left while prefix is active
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[fg=#BE4277#,bold]▌#[fg=#BE4277#,bold] C-SPACE #[default], }"

# Pane borders
set -g pane-active-border-style 'fg=#BE4277'
set -g pane-border-style 'fg=#161616'

# Copy mode and vi keys
setw -g mode-keys vi
setw -g mode-style 'fg=#DD4D8B,bg=#000000,bold'

# Clipboard integration
set -g set-clipboard on

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'off' # no auto restore
set -g @continuum-save-interval '60' # Auto-save every 60 minutes
set -g @resurrect-capture-pane-contents 'on' # Save pane contents
set -g @resurrect-processes ':all:' # Save all processes

# Point TPM at where plugins are actually installed (not the XDG default)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TPM (keep this last)
run '~/.tmux/plugins/tpm/tpm'
