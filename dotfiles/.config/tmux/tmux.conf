##### General Settings #####
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind R command-prompt -I "#W" "rename-window '%%'"

# Ctrl still held after the C-Space prefix = same action as the plain key
bind C-r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind C-z resize-pane -Z
bind C-o run-shell 'sh "$HOME/.config/tmux/float.sh" toggle #{pane_id}'

# Floating window & session selectors (compact, pure black bg, pink frame, no preview/fzf)
bind-key w display-popup -E -w 62 -h 14 -b rounded -s "bg=#000000,fg=#ffffff" -S "fg=#BE4277" \
  -e "TMUX_CLIENT=#{client_name}" -e "TMUX_SESSION=#{session_name}" \
  "python3 $HOME/.config/tmux/nav_list.py windows"
bind-key s display-popup -E -w 62 -h 14 -b rounded -s "bg=#000000,fg=#ffffff" -S "fg=#BE4277" \
  -e "TMUX_CLIENT=#{client_name}" -e "TMUX_SESSION=#{session_name}" \
  "python3 $HOME/.config/tmux/nav_list.py sessions"
set -s escape-time 0

# Enable True color support
set -g default-terminal "tmux-256color"
set -g allow-passthrough on

# set -g detach-on-destroy off
set -g mouse on
set -g history-limit 50000
set -g status-keys emacs # else EDITOR=nvim makes prompts vi-mode
set -g focus-events on
setw -g aggressive-resize on

##### Prefix Key #####
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind Space last-window # replaces default next-layout

##### Keybindings #####
bind-key b set-option status

# Window navigation (prefix+Space = last window, above)
unbind Tab
bind C-n next-window
bind C-p previous-window

# Disable tmux 3.8 native float bindings
unbind @
unbind BTab
unbind '*'
unbind -n C-MouseDrag1Pane
unbind -n C-MouseDrag1Empty

# Pane navigation (vim-tmux-navigator compatible; forwards inside float)
bind-key k if-shell -F '#{@float-session}' { send-prefix ; send-keys 'k' } { select-pane -U }
bind-key j if-shell -F '#{@float-session}' { send-prefix ; send-keys 'j' } { select-pane -D }
bind-key h if-shell -F '#{@float-session}' { send-prefix ; send-keys 'h' } { select-pane -L }
bind-key l if-shell -F '#{@float-session}' { send-prefix ; send-keys 'l' } { select-pane -R }

# Ctrl+hjkl: vim/fzf get the key, else move pane; the float forwards it to its inner tmux
%hidden NAV="#{||:#{@float-session},#{m/ri:^(n?vim?|view|fzf)$,#{pane_current_command}}}"
bind -n C-h if -F "$NAV" 'send C-h' 'select-pane -L'
bind -n C-j if -F "$NAV" 'send C-j' 'select-pane -D'
bind -n C-k if -F "$NAV" 'send C-k' 'select-pane -U'
bind -n C-l if -F "$NAV" 'send C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l # prefix Ctrl+l = clear screen

# Splitting windows in current path (forwards inside float to split scratchpad)
bind | if-shell -F '#{@float-session}' {
  send-prefix
  send-keys '|'
} {
  split-window -h -c "#{pane_current_path}"
}
bind - if-shell -F '#{@float-session}' {
  send-prefix
  send-keys '-'
} {
  split-window -v -c "#{pane_current_path}"
}

# Open lazygit in a new window
bind g new-window -n 'lazygit' -c "#{pane_current_path}" lazygit

# Persistent floating terminal: prefix+o opens/hides, prefix+x closes pane, prefix+X closes scratchpad.
bind o run-shell 'sh "$HOME/.config/tmux/float.sh" toggle #{pane_id}'
bind x if-shell -F '#{@float-session}' {
  send-prefix
  send-keys 'x'
} {
  confirm-before -p 'kill-pane #P? (y/n)' kill-pane
}
bind X if-shell -F '#{@float-session}' {
  run-shell 'sh "$HOME/.config/tmux/float.sh" close #{pane_id}'
}
bind '[' if-shell -F '#{@float-session}' {
  send-prefix
  send-keys '['
} {
  copy-mode
}

# Auto-hide float when clicking outside it (hides rather than closes)
bind-key -T root MouseDown1Pane if-shell -F '#{W:#{?@float-session,1,}}' {
  if-shell -F '#{@float-session}' {
    select-pane -t =
    send-keys -M
  } {
    run-shell 'sh "$HOME/.config/tmux/float.sh" toggle'
  }
} {
  select-pane -t =
  send-keys -M
}

bind-key -T root MouseDown1Border if-shell -F '#{W:#{?@float-session,1,}}' {
  if-shell -F '#{@float-session}' {
    select-pane -t =
  } {
    run-shell 'sh "$HOME/.config/tmux/float.sh" toggle'
  }
} {
  select-pane -t =
}

# Start window numbering at 1
set -g base-index 1
bind 0 select-window -t :=10
setw -g pane-base-index 1
set -g renumber-windows on

##### Status Bar #####
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 5

setw -g window-status-style "none"
set -g window-status-current-style "fg=#505050,bold"
set -g status-style bg=default,fg=brightblack

# Prefix indicator: a solid muted-pink rail + chord lights up top-left while prefix is active
set -g status-left-length 20
set -g status-left "#{?client_prefix,#[fg=#BE4277#,bold]▌#[fg=#BE4277#,bold] C-SPACE #[default], }"

# Pane borders
set -g pane-active-border-style 'fg=#BE4277'
set -g pane-border-style 'fg=#161616'

# Copy mode and vi keys
setw -g mode-keys vi
setw -g mode-style 'fg=#DD4D8B,bg=#000000,bold'
set -g copy-mode-selection-style 'fg=#000000,bg=#A83A6A'
bind -T copy-mode-vi v send -X begin-selection
# x = cut: copies; also deletes it if the selection is on the line being typed
bind -T copy-mode-vi x run-shell 'bash "$HOME/.config/tmux/cut.sh" #{pane_id} #{selection_present} #{selection_start_x} #{selection_start_y} #{selection_end_x} #{selection_end_y} #{cursor_x} #{cursor_y} #{history_size}'

# Clipboard integration
set -g set-clipboard on

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Point TPM at where plugins are actually installed (not the XDG default)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TPM (keep this last)
run '~/.tmux/plugins/tpm/tpm'
