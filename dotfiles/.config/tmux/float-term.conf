# Floating terminal — a real shell you can do anything in.
#   prefix (C-Space) + o  ->  toggle show / hide
#   prefix (C-Space) + x  ->  close it (kills state; next open is fresh)
#
# Backed by a persistent detached session "jankyard", so the float keeps
# its state (cwd, scrollback, running programs) across hide/show.
#   - Outside the float -> open it (attach/create "jankyard").
#   - Inside the float  -> detach-client = hide it (session stays alive).
#   - prefix + x inside -> kill the session; next open starts clean.

# Toggle show/hide
bind-key o if-shell -F '#{==:#{session_name},jankyard}' {
    detach-client
} {
    display-popup -E -d "#{pane_current_path}" -w 56% -h 80% -b single -S "fg=#893056" \
        "tmux new-session -A -s jankyard"
}

# Close the float when inside it, otherwise default kill-pane
bind-key x if-shell -F '#{==:#{session_name},jankyard}' {
    kill-session -t jankyard
} {
    confirm-before -p "kill-pane #{pane_index}? (y/n)" kill-pane
}
