# Monochrome — grayscale only. No color, no rounded borders.

[mgr]
cwd = { fg = "#c6c6c6" }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#eeeeee", bold = true, italic = true }
find_position = { fg = "#808080", bg = "reset", italic = true }

marker_copied   = { fg = "#585858", bg = "#585858" }
marker_cut      = { fg = "#808080", bg = "#808080" }
marker_marked   = { fg = "#a8a8a8", bg = "#a8a8a8" }
marker_selected = { fg = "#e4e4e4", bg = "#e4e4e4" }

count_copied   = { fg = "#1c1c1c", bg = "#767676" }
count_cut      = { fg = "#1c1c1c", bg = "#a8a8a8" }
count_selected = { fg = "#1c1c1c", bg = "#e4e4e4" }

border_symbol = "│"
border_style  = { fg = "#585858" }

[mode]
normal_main = { fg = "#1c1c1c", bg = "#d0d0d0", bold = true }
normal_alt  = { fg = "#d0d0d0", bg = "#3a3a3a" }
select_main = { fg = "#1c1c1c", bg = "#a8a8a8", bold = true }
select_alt  = { fg = "#a8a8a8", bg = "#3a3a3a" }
unset_main  = { fg = "#1c1c1c", bg = "#808080", bold = true }
unset_alt   = { fg = "#808080", bg = "#3a3a3a" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3a3a3a", bg = "#3a3a3a" }

perm_type  = { fg = "#a8a8a8" }
perm_read  = { fg = "#d0d0d0" }
perm_write = { fg = "#808080" }
perm_exec  = { fg = "#eeeeee" }
perm_sep   = { fg = "#585858" }

[which]
cols            = 3
mask            = { bg = "#262626" }
cand            = { fg = "#d0d0d0" }
rest            = { fg = "#808080" }
desc            = { fg = "#a8a8a8" }
separator       = "  "
separator_style = { fg = "#585858" }

[confirm]
border     = { fg = "#585858" }
title      = { fg = "#d0d0d0" }
content    = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  [N]o  " ]

[spot]
border   = { fg = "#585858" }
title    = { fg = "#d0d0d0" }
tbl_col  = { fg = "#eeeeee", bold = true }
tbl_cell = { bg = "#3a3a3a" }

[notify]
title_info  = { fg = "#d0d0d0" }
title_warn  = { fg = "#a8a8a8" }
title_error = { fg = "#eeeeee" }

[pick]
border   = { fg = "#585858" }
active   = { fg = "#eeeeee", bold = true }
inactive = { fg = "#808080" }

[input]
border   = { fg = "#585858" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#585858" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#585858" }
title   = {}
hovered = { fg = "#eeeeee", underline = true }

[help]
on      = { fg = "#d0d0d0" }
run     = { fg = "#a8a8a8" }
desc    = { fg = "#808080" }
hovered = { bg = "#3a3a3a", bold = true }
footer  = { fg = "#1c1c1c", bg = "#d0d0d0" }

[filetype]
rules = [
	# directories / links — brightest
	{ url = "*/", fg = "#eeeeee", bold = true },
	# everything else — plain gray
	{ url = "*",  fg = "#c6c6c6" },
]
