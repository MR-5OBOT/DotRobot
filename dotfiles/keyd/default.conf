# keyd remaps keys at the kernel level, so a mapping works the same in
# Hyprland, the TTY and hyprlock. Edit here, then run scripts/setup-keyd.sh.
#
#   sudo keyd monitor        print key names as you press them
#   keyd list-keys           every valid key name
#   Backspace+Escape+Enter   panic: stop keyd if a mapping locks you out
#
# Actions:
#   overload(layer, key)     hold = layer, tap = key
#   layer(name)              layer is active while held
#   oneshot(layer)           layer applies to the next key only
#   macro(C-c space)         type a sequence

# Only these keyboards, not `*`, so brightness keys and the mouse stay untouched.
# Add another keyboard's vendor:product id (from `lsusb`) to remap it too.
# 1a2c:90f5 = SEMICO USB gaming keyboard, 0001:0001 = laptop keyboard
[ids]
1a2c:90f5
0001:0001

[main]
# hold = vim arrows, tap = normal Caps Lock
capslock = overload(nav, capslock)

[nav]
h = left
j = down
k = up
l = right
minus = volumedown
equal = volumeup
space = micmute
