<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a0f" />
      <stop offset="50%" stop-color="#121018" />
      <stop offset="100%" stop-color="#09080d" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181622" />
      <stop offset="100%" stop-color="#13121a" />
    </linearGradient>
    <linearGradient id="cardGradHover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1c2b" />
      <stop offset="100%" stop-color="#15141e" />
    </linearGradient>

    <!-- Accent Header Gradients -->
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#c77dff" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="gradIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#9d4edd" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c77dff" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f472b6" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #f3f4f6; letter-spacing: 0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #9ca3af; }
    .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f9fafb; letter-spacing: 0.3px; }
    .badge { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: 600; }
    .item-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    .item-desc { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    .section-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; fill: #6b7280; }
    .flow-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="1200" height="760" fill="url(#grid)" />
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="4" height="42" rx="2" fill="url(#gradPurple)" />
    <text x="16" y="22" class="title">DotRobot // dotfiles Architecture &amp; Execution Flow</text>
    <text x="16" y="39" class="subtitle">Arch Linux • Hyprland (Lua) • Quickshell Island • Kitty &amp; Tmux • mr5obot-scheme</text>
    <rect x="990" y="8" width="130" height="26" rx="13" fill="#201a2d" stroke="#58297d" stroke-width="1" />
    <text x="1055" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#d8b4fe">~/repos/DotRobot</text>
  </g>

  <!-- ==================== FLOW CONNECTING PATHS ==================== -->
  <!-- 1. Input -> Session -->
  <path d="M 160 305 L 160 355" class="flow-line" stroke="#38bdf8" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />

  <!-- 2. Session -> Hyprland -->
  <path d="M 280 435 C 305 435, 305 240, 325 240" class="flow-line" stroke="#38bdf8" marker-end="url(#arrowCyan)" />

  <!-- 3. Hyprland <-> Quickshell (Bidirectional) -->
  <path d="M 445 400 L 445 440" class="flow-line" stroke="#c77dff" stroke-width="2.5" marker-end="url(#arrowPurple)" />
  <path d="M 485 440 L 485 400" class="flow-line" stroke="#c77dff" stroke-width="2.5" marker-end="url(#arrowPurple)" />

  <!-- 4. Hyprland -> Kitty/Tmux -->
  <path d="M 610 240 L 640 240" class="flow-line" stroke="#fbbf24" marker-end="url(#arrowOrange)" />

  <!-- 5. Kitty -> Zsh/TUI -->
  <path d="M 770 310 L 770 355" class="flow-line" stroke="#fbbf24" marker-end="url(#arrowOrange)" />

  <!-- 6. Theme Styling Flow (dashed to Hyprland & Kitty) -->
  <path d="M 945 190 C 880 190, 880 150, 785 150" class="flow-line" stroke="#f472b6" stroke-dasharray="5,5" opacity="0.75" />
  <path d="M 945 220 C 700 220, 650 170, 610 170" class="flow-line" stroke="#f472b6" stroke-dasharray="5,5" opacity="0.75" marker-end="url(#arrowPink)" />

  <!-- ==================== COLUMN 1: HARDWARE & SESSION ==================== -->
  <text x="40" y="98" class="section-label">1 • Input &amp; Session</text>

  <!-- CARD 1A: Input Layer -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <rect width="240" height="195" rx="10" fill="url(#cardGrad)" stroke="#2b273b" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="4" rx="2" fill="url(#gradCyan)" />
    
    <text x="16" y="28" class="card-title">Hardware &amp; Input</text>
    <rect x="160" y="14" width="66" height="18" rx="9" fill="#0c4a6e" />
    <text x="193" y="26" text-anchor="middle" class="badge" fill="#38bdf8">KERNEL</text>

    <!-- Item 1: keyd -->
    <g transform="translate(16, 48)">
      <circle cx="4" cy="6" r="3" fill="#38bdf8" />
      <text x="14" y="8" class="item-title">keyd/default.conf</text>
      <text x="14" y="24" class="item-desc">Caps: hold = vim nav, tap = Caps</text>
      <text x="14" y="38" class="item-desc">Copied to /etc/keyd/ by setup-keyd.sh</text>
    </g>

    <!-- Item 2: wl-kbptr -->
    <g transform="translate(16, 115)">
      <circle cx="4" cy="6" r="3" fill="#38bdf8" />
      <text x="14" y="8" class="item-title">.config/wl-kbptr/</text>
      <text x="14" y="24" class="item-desc">Wayland keyboard-driven cursor</text>
      <text x="14" y="38" class="item-desc">Vim keys mouse navigation</text>
    </g>
  </g>

  <!-- CARD 1B: Session Entry -->
  <g transform="translate(40, 360)" filter="url(#cardShadow)">
    <rect width="240" height="150" rx="10" fill="url(#cardGrad)" stroke="#2b273b" stroke-width="1.2" />
    <rect x="0" y="0" width="240" height="4" rx="2" fill="url(#gradCyan)" />

    <text x="16" y="28" class="card-title">Session Manager</text>
    <rect x="165" y="14" width="61" height="18" rx="9" fill="#0c4a6e" />
    <text x="195" y="26" text-anchor="middle" class="badge" fill="#38bdf8">UWSM</text>

    <g transform="translate(16, 50)">
      <circle cx="4" cy="6" r="3" fill="#38bdf8" />
      <text x="14" y="8" class="item-title">.config/uwsm/env</text>
      <text x="14" y="25" class="item-desc">Wayland environment bootstrap</text>
      <text x="14" y="40" class="item-desc">Sets XDG, QT_QPA_PLATFORM,</text>
      <text x="14" y="55" class="item-desc">and systemd session scope</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: COMPOSITOR & DESKTOP UI ==================== -->
  <text x="330" y="98" class="section-label">2 • Window Manager &amp; UI</text>

  <!-- CARD 2A: Hyprland -->
  <g transform="translate(330, 110)" filter="url(#cardShadow)">
    <rect width="280" height="285" rx="10" fill="url(#cardGrad)" stroke="#4a2268" stroke-width="1.4" />
    <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#gradPurple)" />

    <text x="16" y="28" class="card-title">Hyprland Compositor</text>
    <rect x="200" y="14" width="66" height="18" rx="9" fill="#3b0764" />
    <text x="233" y="26" text-anchor="middle" class="badge" fill="#d8b4fe">LUA CFG</text>

    <!-- Sub items -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="248" height="44" rx="6" fill="#1f1a2e" stroke="#3b2b52" stroke-width="1" />
      <text x="12" y="18" class="item-title">hyprland.lua</text>
      <text x="12" y="33" class="item-desc">Modular entrypoint loading lua_configs/</text>
    </g>

    <g transform="translate(16, 100)">
      <text x="4" y="12" class="item-title" fill="#c084fc">lua_configs/</text>
      <text x="16" y="28" class="item-desc">• keymaps.lua &amp; monitors.lua</text>
      <text x="16" y="43" class="item-desc">• autostart.lua &amp; windowrules.lua</text>
      <text x="16" y="58" class="item-desc">• theme.lua (gaps, shadows, bloom)</text>
    </g>

    <g transform="translate(16, 178)">
      <rect x="0" y="0" width="248" height="42" rx="6" fill="#1b1827" stroke="#2e253e" stroke-width="1" />
      <text x="10" y="17" class="item-title">hypridle &amp; hyprlock</text>
      <text x="10" y="32" class="item-desc">Idle timeout, DPMS off &amp; lockscreen</text>
    </g>

    <g transform="translate(16, 230)">
      <text x="4" y="14" class="item-title" fill="#c084fc">scripts/controls/ &amp; daemons/</text>
      <text x="16" y="31" class="item-desc">brightness.sh, volume.sh, screenshot.sh</text>
    </g>
  </g>

  <!-- CARD 2B: Quickshell UI -->
  <g transform="translate(330, 445)" filter="url(#cardShadow)">
    <rect width="280" height="270" rx="10" fill="url(#cardGrad)" stroke="#4a2268" stroke-width="1.4" />
    <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#gradPurple)" />

    <text x="16" y="28" class="card-title">Quickshell Desktop UI</text>
    <rect x="210" y="14" width="56" height="18" rx="9" fill="#3b0764" />
    <text x="238" y="26" text-anchor="middle" class="badge" fill="#d8b4fe">QML</text>

    <g transform="translate(16, 48)">
      <text x="4" y="12" class="item-title" fill="#e879f9">island/ (Dynamic Island Bar)</text>
      <text x="16" y="28" class="item-desc">• Island.qml &amp; Pill.qml status bar</text>
      <text x="16" y="43" class="item-desc">• Surfaces: Sysmon, Media, Battery, OSD</text>
      <text x="16" y="58" class="item-desc">• Singletons: Weather, Walls, Notifs</text>
    </g>

    <g transform="translate(16, 126)">
      <text x="4" y="12" class="item-title" fill="#e879f9">Popups &amp; Overlays</text>
      <text x="16" y="28" class="item-desc">• Launcher.qml (Search &amp; Run)</text>
      <text x="16" y="43" class="item-desc">• Clipboard.qml &amp; Keymaps.qml</text>
      <text x="16" y="58" class="item-desc">• WallpaperPanel.qml &amp; Calculator.qml</text>
    </g>

    <g transform="translate(16, 202)">
      <rect x="0" y="0" width="248" height="44" rx="6" fill="#20172e" stroke="#502479" stroke-width="1" />
      <text x="10" y="18" class="item-title">rishot/ (bin/rishot)</text>
      <text x="10" y="33" class="item-desc">Integrated screenshot &amp; annotation canvas</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: TERMINAL & CLI ==================== -->
  <text x="650" y="98" class="section-label">3 • Terminal &amp; Shell</text>

  <!-- CARD 3A: Kitty & Tmux -->
  <g transform="translate(650, 110)" filter="url(#cardShadow)">
    <rect width="260" height="200" rx="10" fill="url(#cardGrad)" stroke="#3f2e18" stroke-width="1.2" />
    <rect x="0" y="0" width="260" height="4" rx="2" fill="url(#gradOrange)" />

    <text x="16" y="28" class="card-title">Terminal &amp; Multiplexer</text>
    <rect x="195" y="14" width="51" height="18" rx="9" fill="#451a03" />
    <text x="220" y="26" text-anchor="middle" class="badge" fill="#fbbf24">TERM</text>

    <g transform="translate(16, 48)">
      <circle cx="4" cy="6" r="3" fill="#f59e0b" />
      <text x="14" y="8" class="item-title">kitty/ (kitty.conf)</text>
      <text x="14" y="23" class="item-desc">GPU accelerated terminal emulator</text>
      <text x="14" y="37" class="item-desc">Colors: black.ini theme</text>
    </g>

    <g transform="translate(16, 110)">
      <circle cx="4" cy="6" r="3" fill="#f59e0b" />
      <text x="14" y="8" class="item-title">tmux/ (tmux.conf)</text>
      <text x="14" y="23" class="item-desc">Popups: float.sh, cut.sh</text>
      <text x="14" y="37" class="item-desc">nav_list.py session helper</text>
    </g>
  </g>

  <!-- CARD 3B: Zsh & TUI Tools -->
  <g transform="translate(650, 360)" filter="url(#cardShadow)">
    <rect width="260" height="355" rx="10" fill="url(#cardGrad)" stroke="#3f2e18" stroke-width="1.2" />
    <rect x="0" y="0" width="260" height="4" rx="2" fill="url(#gradOrange)" />

    <text x="16" y="28" class="card-title">Shell &amp; CLI Ecosystem</text>
    <rect x="195" y="14" width="51" height="18" rx="9" fill="#451a03" />
    <text x="220" y="26" text-anchor="middle" class="badge" fill="#fbbf24">SHELL</text>

    <!-- Zsh -->
    <g transform="translate(16, 48)">
      <text x="0" y="12" class="item-title" fill="#fcd34d">zsh/ (.zshrc &amp; .zshenv)</text>
      <text x="12" y="28" class="item-desc">• conf.d/aliases.zsh</text>
      <text x="12" y="42" class="item-desc">• conf.d/plugins.zsh (syntax, autosuggest)</text>
      <text x="12" y="56" class="item-desc">• conf.d/completion.zsh &amp; functions.zsh</text>
    </g>

    <!-- Starship & Fastfetch -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="228" height="52" rx="6" fill="#241913" stroke="#4a301a" stroke-width="1" />
      <text x="10" y="18" class="item-title">starship.toml &amp; fastfetch/</text>
      <text x="10" y="34" class="item-desc">Minimal cross-shell prompt + custom</text>
      <text x="10" y="46" class="item-desc">system banner (pochita / ryuzaki)</text>
    </g>

    <!-- Superfile & Viewers -->
    <g transform="translate(16, 196)">
      <text x="0" y="12" class="item-title" fill="#fcd34d">superfile/ (config &amp; hotkeys)</text>
      <text x="12" y="28" class="item-desc">Modern terminal file manager</text>
      <text x="12" y="42" class="item-desc">Bundled themes: mocha, ayu, nord...</text>
    </g>

    <g transform="translate(16, 260)">
      <rect x="0" y="0" width="228" height="48" rx="6" fill="#1b171c" stroke="#332a39" stroke-width="1" />
      <text x="10" y="18" class="item-title">glow/ &amp; zathura/</text>
      <text x="10" y="33" class="item-desc">Markdown reader &amp; Vim PDF viewer</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: THEME & HELPERS ==================== -->
  <text x="945" y="98" class="section-label">4 • Theming &amp; System</text>

  <!-- CARD 4A: Unified mr5obot Theme -->
  <g transform="translate(945, 110)" filter="url(#cardShadow)">
    <rect width="215" height="280" rx="10" fill="url(#cardGrad)" stroke="#451e36" stroke-width="1.2" />
    <rect x="0" y="0" width="215" height="4" rx="2" fill="url(#gradPink)" />

    <text x="14" y="28" class="card-title">mr5obot-scheme</text>
    <rect x="145" y="14" width="56" height="18" rx="9" fill="#500724" />
    <text x="173" y="26" text-anchor="middle" class="badge" fill="#f472b6">THEME</text>

    <g transform="translate(14, 48)">
      <text x="0" y="12" class="item-title" fill="#f472b6">GTK &amp; Qt Uniformity</text>
      <text x="10" y="28" class="item-desc">• gtk-3.0 / gtk-4.0 settings</text>
      <text x="10" y="42" class="item-desc">• qt5ct &amp; qt6ct (qss styles)</text>
      <text x="10" y="56" class="item-desc">• .local/share/themes/</text>
      <text x="10" y="70" class="item-desc">• .local/share/color-schemes/</text>
    </g>

    <g transform="translate(14, 140)">
      <text x="0" y="12" class="item-title" fill="#f472b6">Typography &amp; Apps</text>
      <text x="10" y="28" class="item-desc">• fontconfig (41-arabic-sans)</text>
      <text x="10" y="43" class="item-desc">• vesktop/ (system24 discord)</text>
      <text x="10" y="58" class="item-desc">• cursor: volantes-light</text>
      <text x="10" y="73" class="item-desc">• icons: gruvbox-plus</text>
    </g>
  </g>

  <!-- CARD 4B: Helpers, Daemons & Tools -->
  <g transform="translate(945, 415)" filter="url(#cardShadow)">
    <rect width="215" height="300" rx="10" fill="url(#cardGrad)" stroke="#272744" stroke-width="1.2" />
    <rect x="0" y="0" width="215" height="4" rx="2" fill="url(#gradIndigo)" />

    <text x="14" y="28" class="card-title">Scripts &amp; Daemons</text>
    <rect x="148" y="14" width="53" height="18" rx="9" fill="#1e1b4b" />
    <text x="174" y="26" text-anchor="middle" class="badge" fill="#818cf8">SYSTEM</text>

    <g transform="translate(14, 48)">
      <text x="0" y="12" class="item-title" fill="#a5b4fc">.local/bin/ Utilities</text>
      <text x="10" y="28" class="item-desc">• dell-latitude-5450-charge-cap</text>
      <text x="10" y="42" class="item-desc">• dell-sleep-power-drain-fix</text>
      <text x="10" y="56" class="item-desc">• powerprofile &amp; sysmaintenance</text>
      <text x="10" y="70" class="item-desc">• scrcpy-wifi &amp; droid</text>
    </g>

    <g transform="translate(14, 140)">
      <text x="0" y="12" class="item-title" fill="#a5b4fc">Background Daemons</text>
      <text x="10" y="28" class="item-desc">• systemd user service:</text>
      <text x="18" y="43" class="item-desc">battery-notify.service</text>
    </g>

    <g transform="translate(14, 205)">
      <rect x="0" y="0" width="187" height="46" rx="6" fill="#16152a" stroke="#2c2a52" stroke-width="1" />
      <text x="8" y="18" class="item-title">.claude/ &amp; .gitconfig</text>
      <text x="8" y="32" class="item-desc">Assistant env &amp; Git identity</text>
    </g>
  </g>

</svg>
