# Writeback tuning — keeps the page cache from hoarding gigabytes of dirty
# pages and then flushing them in one blocking burst.
#
# Defaults (dirty_ratio=20 / dirty_background_ratio=10) are percentages of RAM.
# On 16GB that lets ~3.1GB of dirty pages accumulate before the kernel forces
# synchronous writeback, which stalls *every* process on the system (visible in
# /proc/pressure/io as "full"). Chromium profiles are a heavy trigger: leveldb
# logs and session state get rewritten constantly, so the pile builds fast.
#
# Byte limits override the ratios. Small, frequent flushes instead of one big
# stall-the-world flush.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
