# Tuning for swap on zram (same values Pop!_OS ships).
# zram is RAM-speed, so let the kernel compress idle pages early instead of
# dropping file cache, and skip swap readahead that only helps spinning disks.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
