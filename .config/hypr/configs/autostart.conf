# Autostart

$SCRIPTS = ~/.config/hypr/scripts

# Critical Services
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Set environment variables for XDG Desktop Portal
# exec-once = $SCRIPTS/autostart/xdgportals.sh >> ~/.hyprland-autostart.log 2>&1
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Daemons
exec-once = hyprpaper
# exec-once = dunst
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = clipse -listen
exec-once = devify
# exec-once = blueman-applet
exec-once = hypridle

# Launch Scripts
exec-once = $SCRIPTS/autostart/gtk.sh >> ~/.hyprland-autostart.log 2>&1
exec-once = $SCRIPTS/autostart/toggle-waybar.sh >> ~/.hyprland-autostart.log 2>&1
exec-once = $SCRIPTS/autostart/BAT-check.sh >> ~/.hyprland-autostart.log 2>&1

