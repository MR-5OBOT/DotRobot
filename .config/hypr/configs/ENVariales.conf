# █▀▀ █▄░█ █░█
# ██▄ █░▀█ ▀▄▀

# Backend Variables
env = GDK_BACKEND,wayland,x11  # Prefer Wayland, fallback to X11  
env = CLUTTER_BACKEND,wayland  # Force Clutter to use Wayland  
env = SDL_VIDEODRIVER,wayland  # SDL2 on Wayland (set to x11 if issues)  

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland  
env = XDG_SESSION_TYPE,wayland  
env = XDG_SESSION_DESKTOP,Hyprland  
env = WLR_NO_HARDWARE_CURSORS,1

# Qt Variables  
env = QT_AUTO_SCREEN_SCALE_FACTOR,1  # Auto scale for HiDPI  
env = QT_QPA_PLATFORM,wayland;xcb  # Prefer Wayland, fallback to X11  
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1  # Remove Qt window borders  
env = QT_QPA_PLATFORMTHEME,qt6ct

# Theming  
env = GTK_THEME,paradice  # Set GTK theme  
env = XCURSOR_THEME,Future-dark-cursors  # Cursor theme  
env = XCURSOR_SIZE,24  # Cursor size  

# Mozilla
env = MOZ_ENABLE_WAYLAND,1  
# GTK
env = GDK_SCALE,1
# OZONE
env = OZONE_PLATFORM,wayland

# Disable appimage launcher by default
# env = APPIMAGELAUNCHER_DISABLE,1

# For KVM virtual machines
# env = WLR_NO_HARDWARE_CURSORS, 1
# env = WLR_RENDERER_ALLOW_SOFTWARE, 1

