# Workspace assignments
windowrule = workspace 1, match:class firefox
windowrule = workspace 1, match:class ^(brave-.*)$
windowrule = workspace 2, match:class kitty
windowrule = workspace 3, match:class ^(org.telegram.desktop)$
windowrule = workspace 5, match:class ^(gimp-.*)$
windowrule = workspace 6, match:class ^(com.obsproject.Studio)$
windowrule = workspace 8, match:class mpv

windowrule = float on, center on, size 620 360, match:class kitty
windowrule = float on, center on, size 700 600, match:class ^(qalculate-gtk)$
windowrule = float on, center on, size 700 600, match:class ^(thunar)$
windowrule = pin on, float on, center on, size 600 400, match:class hyprland-share-picker
windowrule = pin on, float on, size 500 400, center on, match:class nwg-look
windowrule = float on, size 522 552, center on, match:class clipse

# TradingView (Brave popup)
windowrule = workspace 4, match:class ^(brave-knojlbibkfmpiekeiifbljpfojlioonl-Default)$

# Floating utilities and dialogs
windowrule = float on, match:class ^(Tk)$
windowrule = float on, match:class ^(thunar)$
windowrule = pin on, float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(file-roller)$
windowrule = float on, match:class mpv
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float on, match:title ^(Media viewer)$
windowrule = float on, match:title ^(Volume Control)$
windowrule = float on, match:class ^(Picture-in-Picture)$
windowrule = float on, match:class ^(Viewnior)$
windowrule = float on, match:class ^(file_progress)$
windowrule = float on, match:class ^(confirm)$
windowrule = float on, match:class ^(dialog)$
windowrule = float on, match:class ^(download)$
windowrule = float on, match:class ^(notification)$
windowrule = float on, match:class ^(error)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(Confirm to replace files)$
windowrule = float on, match:class ^(File Operation Progress)$
windowrule = float on, match:class vlc
windowrule = float on, match:class kvantummanager
windowrule = float on, match:class qt5ct
windowrule = float on, match:class qt6ct
windowrule = float on, match:class nwg-look

# For complex file dialogs (example; adjust regex as needed for OR logic if supported, or split)
windowrule = float on, match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files)$

# XWayland video bridge (screen sharing hide)
windowrule = opacity 0.0 override, no_anim on, no_initial_focus on, max_size 1 1, no_blur on, match:class ^(xwaylandvideobridge)$

