include ~/.config/kitty/fsociety.ini

font_size 11.5
font_family        IosevkaTermNerdFontMono
italic_font        auto
bold_font          auto
bold_italic_font   auto
# italic_font        IosevkaTerm NFM Medium Italic
# bold_font          IosevkaTerm NFM Medium Obl


remember_window_size yes
cursor_blink_interval 0.5
