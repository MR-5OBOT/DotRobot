# include ~/.config/kitty/fsociety.ini
include ~/.config/kitty/black_metal.ini

# font_size 11.5
# font_family        IosevkaTermNerdFontMono
# italic_font        auto
# bold_font          auto
# bold_italic_font   auto
# # italic_font        IosevkaTerm NFM Medium Italic
# # bold_font          IosevkaTerm NFM Medium Obl
#
#
# remember_window_size yes
# cursor_blink_interval 0.5
# cursor_stop_blinking_after 0
# window_margin_width 5 
# # 0 disables it; -1 enables it
# # confirm_os_window_close 0
#
kitten=image-pipe

include ~/dotfiles/.config/kitty/themes/black_metal_gorgoroth.conf

allow_remote_control yes

# map super+u           set_background_opacity 1
# map super+shift+u     set_background_opacity default
# map super+shift+i     set_background_opacity 0.9

font_family IosevkaTermNerdFontMono
font_size 11.5
text_composition_strategy legacy
modify_font cell_width 95%

shell_integration no-cursor
enable_audio_bell no

remember_window_size yes
dynamic_background_opacity yes
hide_window_decorations yes
# window_padding_width 0
# window_padding_height 0
window_margin_width 5
# background_blur 10
placement_strategy top

cursor_trail 10
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.01 0.15
cursor_shape block
cursor_blink true

# background_opacity 0.8
# set_background_opacity 1
# background_opacity 1.0
