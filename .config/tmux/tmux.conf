##### General Settings #####

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Fast response
set -s escape-time 0

# Enable True color support
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

set -g detach-on-destroy off
set -g mouse on

##### Prefix Key #####
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

##### Keybindings #####
bind d detach-client
bind-key q kill-server
bind n command-prompt -p "New session name:" "new-session -s '%%'"
bind-key b set-option status

bind H previous-window
bind L next-window

# Pane navigation (vim-tmux-navigator compatible)
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# Pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Splitting windows in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open lazygit in a new window
bind G new-window -n 'lazygit' -c "#{pane_current_path}" lazygit

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Status Bar #####
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-interval 5
setw -g window-status-style "none"
set -g window-status-current-style "fg=#505050,bold"
set -g status-style bg=default,fg=brightblack

# Pane borders
set -g pane-active-border-style 'fg=#BE4277'
set -g pane-border-style 'fg=#161616'

# Copy mode and vi keys
setw -g mode-keys vi
setw -g mode-style 'fg=#DD4D8B bg=#000000 bold'

# Clipboard integration
set -g set-clipboard on

# Disable activity monitoring (no highlights or bells)
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off


##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux float pane
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'f'
set -g @floax-width '60%'
set -g @floax-height '60%'
set -g @floax-change-path 'true'
# set -g @floax-border-color 'magenta'
# set -g @floax-text-color 'blue'

# # fzf float windows & sessions
# set -g @plugin 'omerxx/tmux-sessionx'
# set -g @sessionx-bind 's'
# set -g @sessionx-x-path '~/repos'
# set -g @sessionx-preview-ratio '70%'
# set -g @sessionx-layout 'reverse'
# set -g @sessionx-preview-location 'right'
# set -g @sessionx-preview-enabled 'true'
# set -g @sessionx-window-height '80%'
# set -g @sessionx-window-width '80%'

# fzf urls
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'l'
set -g @fzf-url-fzf-options '-p 40%,40% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep this last)
run '~/.tmux/plugins/tpm/tpm'
